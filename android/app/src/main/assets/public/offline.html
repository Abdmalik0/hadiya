<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Connection Interrupted - HALABA City FC</title>
  <meta name="theme-color" content="#0a0a0a" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0a0a0a;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      overflow: hidden;
    }
    .card {
      background: linear-gradient(180deg, #181818 0%, #101010 100%);
      border: 1px solid #2a2a2a;
      border-radius: 28px;
      padding: 36px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(220, 38, 38, 0.4);
      color: #f87171;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 20px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .icon-container {
      width: 84px;
      height: 84px;
      border-radius: 22px;
      background: #0f0f0f;
      border: 1px solid #333333;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    }
    .icon-container img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .amharic {
      color: #4ade80;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 14px;
      letter-spacing: 0.02em;
    }
    p {
      color: #a3a3a3;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #c80815 0%, #96000a 100%);
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 8px 20px rgba(200, 8, 21, 0.4);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .status-box {
      margin-top: 20px;
      background: #0a0a0a;
      border: 1px solid #222222;
      border-radius: 12px;
      padding: 12px;
      width: 100%;
      font-size: 11px;
      color: #737373;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="dot"></span>
      <span>Connection Interrupted</span>
    </div>

    <div class="icon-container">
      <img src="./pwa-192x192.png" onerror="this.onerror=null;this.src='./icon.svg'" alt="Halaba City FC Crest" />
    </div>

    <h1>HALABA CITY FC</h1>
    <div class="amharic">የኢንተርኔት ግንኙነት ተቋርጧል • ከመስመር ውጭ</div>

    <p>
      You are currently offline. Any previously cached club standings, squad details, and matchday news remain safely preserved in the app.
    </p>

    <button class="btn" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2v6h-6"></path>
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
        <path d="M3 22v-6h6"></path>
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
      </svg>
      Retry Connection
    </button>

    <div class="status-box">
      HALABA City FC PWA Engine • Berberewochu Offline Mode
    </div>
  </div>
</body>
</html>
